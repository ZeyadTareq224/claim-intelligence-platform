name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://claim:claim_local@localhost:5432/claims
      TEST_DATABASE_URL: postgresql+psycopg://claim:claim_local@localhost:5432/claims_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: claim
          POSTGRES_PASSWORD: claim_local
          POSTGRES_DB: claims
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claim -d claims"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            frontend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[test]" -r ../frontend/requirements.txt

      - name: Install Tesseract English OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install Bandit
        run: python -m pip install "bandit>=1.8,<2"

      - name: Run Bandit security scan
        working-directory: backend
        run: bandit -r app fixtures migrations ../frontend/main.py

      - name: Create isolated test database
        working-directory: backend
        run: |
          python - <<'PY'
          import psycopg

          with psycopg.connect(
              "host=localhost dbname=postgres user=claim password=claim_local",
              autocommit=True,
          ) as connection:
              connection.execute("CREATE DATABASE claims_test OWNER claim")
          PY

      - name: Apply Alembic migrations
        working-directory: backend
        run: |
          alembic upgrade head
          DATABASE_URL="$TEST_DATABASE_URL" alembic upgrade head

      - name: Run real OCR smoke test
        working-directory: backend
        run: pytest -q tests/ocr

      - name: Run unit tests
        working-directory: backend
        run: pytest -q tests/unit

      - name: Run integration tests
        working-directory: backend
        run: |
          results="$RUNNER_TEMP/integration-results.xml"
          pytest -q -rs tests/integration ../frontend/tests --junitxml="$results"
          python - "$results" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          skipped = sum(int(suite.get("skipped", "0")) for suite in root.iter("testsuite"))
          if skipped:
              raise SystemExit(f"Expected no skipped integration tests, found {skipped}")
          PY
