services:
  platform:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:${PLATFORM_PORT:-8501}:8501"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-claim}:${POSTGRES_PASSWORD:-claim_local}@db:5432/${POSTGRES_DB:-claims}
      PDF_STORAGE_DIR: /var/lib/claim-platform/pdfs
      PDF_MAX_BYTES: ${PDF_MAX_BYTES:-26214400}
      PDF_MAX_PAGES: ${PDF_MAX_PAGES:-200}
      PDF_NATIVE_TIMEOUT_SECONDS: ${PDF_NATIVE_TIMEOUT_SECONDS:-30}
      PDF_OCR_LANGUAGE: ${PDF_OCR_LANGUAGE:-eng}
      PDF_OCR_DPI: ${PDF_OCR_DPI:-200}
      PDF_OCR_TIMEOUT_SECONDS: ${PDF_OCR_TIMEOUT_SECONDS:-60}
      PDF_OCR_MAX_PIXELS: ${PDF_OCR_MAX_PIXELS:-25000000}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-30}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-2048}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-1000}
    volumes:
      - pdf_data:/var/lib/claim-platform/pdfs
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-claim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claim_local}
      POSTGRES_DB: ${POSTGRES_DB:-claims}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
  pdf_data:
